  minimal && basic_test && small:
    stage: python-tests
    component: python-ut
    inputs:
      customTestConfig:
        dockerImage: ${{jobs.build.outputs.image}}
        testScript: |
          chown -R admin:admin .
          path=$(pwd)
          su - admin << EOF
