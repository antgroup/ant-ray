  集成测试:
    stage: 集成测试
    id: ant-ray-it
    displayName: java_integration_test@it
    component: linkq-ut
    inputs:
      gitRepo: https://code.alipay.com/mrd_group/ant-ray-testcase.git
      gitBranch: master
      gitCommitId: 5d3af13dbfb6731c92d8611c8e79dc78d7d82f48
      accurate: true #是否启用精准测试
      ciConfig:
        jdkVersion: "1.8" #jdk版本 1.6 1.7 1.8 11
        mvnVersion: "3.9.8" #maven版本  2.2.1 3.0.3 3.2.5 3.5.4 3.5.4 3.6.1
        encoding: "UTF-8" #文件编码 UTF-8 GBK
        mvnArgs: "-Dak=${{secrets.RAY_STUDIO_AK}} -Dsk=${{secrets.RAY_STUDIO_SK}} -DrayImage=${{jobs.build.outputs.image}}"  #mvn参数 -D形式
        parallelCount: "1" #分组数，将所有测试类分到N台机器运行
        autoPom: "true" #是否自动修改pom true false
    config:
      execute:
        isAllowSkip: true
      afterExecute:
        checkRule: # 质量规则校验策略，outputs的数值在0-100之间
          - ${{outputs.casePassRate}} >= 100 #通过率
        allowFailure: true