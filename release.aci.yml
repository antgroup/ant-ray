version: "2.0"

stages:
  - code-lint
  - image-build
  - python-tests
  - java-tests
  - cpp-tests
  - ray-data-tests
  - wheel-build
  - pypi-release-dev
  - pypi-release-check
  - pypi-release-prod
  - 集成测试

workflow:
  stages:
    image-build:
      requires: 
        - code-lint
    python-tests:
      requires:
        - image-build
    java-tests:
      requires:
        - image-build
    cpp-tests:
      requires:
        - image-build
    ray-data-tests:
      requires:
        - image-build
    集成测试:
      requires:
        - image-build
    wheel-build:
      requires: 
        - code-lint
    pypi-release-dev:
      requires:
        - wheel-build
    pypi-release-check:
      requires:
        - pypi-release-dev
        - python-tests
        - java-tests
        - cpp-tests
        - ray-data-tests
        - 集成测试
    pypi-release-prod:
      requires:
        - pypi-release-check


jobs:
  code-format:
    id: lint
    stage: code-lint
    component: ant-code-build
    inputs:
      name: code-sast
      environment:
        type: LINUX_CONTAINER
        image: reg.antgroup-inc.cn/antray/ant-ray-ci:79304b0ec7b1b078fc255d29373a06f6b383df96
      caches: 
      resources: null
      buildTasks:
        - name: format-code
          commands: |
            cd code-repo
            pip install -c python/requirements_compiled.txt -r python/requirements/lint-requirements.txt
            wget -q http://ray-streaming.oss-cn-hangzhou-zmf.aliyuncs.com/util%2Fgoogle-java-format-1.7-all-deps.jar -O /tmp/google-java-format-1.7-all-deps.jar
            export PATH=/home/admin/jdk-21.0.9/bin:$PATH
            FORMAT_SH_PRINT_DIFF=1 bash ci/lint/format.sh --all || exit $?
      timeout: 900

  alios_x86_64:
    stage: image-build
    id: build
    component: docker-image-build
    inputs:
      imageName: reg.antgroup-inc.cn/antray/ant-ray-ci
      imageTag: ut-${{vcs.commitSha}}
      dockerfile: ./ci/docker/internal.build_wheel_remote.Dockerfile
      contextDir: ./
      buildArgs: null 
      registryUsername: ${{secrets.RAY_DOCKERHUB_USERNAME}}
      registryPassword: ${{secrets.RAY_DOCKERHUB_PASSWORD}}
      skipWhenImageExists: true
      errWhenImageExists: true
      beforeScript: null
      beforeScriptImage: null
      afterScript: null
      afterScriptImage: null
      nydusSwitch: true
      cacheStrategy: always
      extraTags: null
      timeoutInSec: 21600
    config:
      execute:
        isAllowSkip: true
  

  manylinux_x86_64:
    stage: wheel-build
    id: wheel
    component: docker-image-build
    config:
      execute:
        isAllowSkip: true
    inputs:
      imageName: reg.antgroup-inc.cn/antray/ant-ray-ci
      imageTag: wheel-${{vcs.commitSha}}
      computeType: xlarge
      dockerfile: ./ci/docker/internal.build_wheel.Dockerfile
      contextDir: ./
      buildArgs: null 
      registryUsername: ${{secrets.RAY_DOCKERHUB_USERNAME}}
      registryPassword: ${{secrets.RAY_DOCKERHUB_PASSWORD}}
      skipWhenImageExists: true
      errWhenImageExists: true
      beforeScript: null
      beforeScriptImage: null
      afterScript: null
      afterScriptImage: null
      nydusSwitch: true
      cacheStrategy: always
      extraTags: null
      timeoutInSec: 21600


  pypi-release-dev:
    stage: pypi-release-dev
    id: upload
    component: pypi-artifact-uploader
    inputs:
      buildImage: ${{jobs.wheel.outputs.image}}
      buildTool: null
      buildCmd: >
        echo "admin" | sudo -S chown -R admin:admin .
        && mv /home/admin/code/python/wheelhouse ./python/dist
      workdir: null
      registry: "https://artifacts.antgroup-inc.cn/artifact/repositories/simple-dev/"
      outDir: ./python/dist
  
  pypi-release-check:
    id: check
    stage: pypi-release-check
    component: artifact-transfer-check
    inputs: 
      artifactsConfigs:
        - artifacts: ${{jobs.upload.outputs.artifacts}}
          antArtifactRepo: simple
  
  pypi-release-prod:
    stage: pypi-release-prod
    component: ant-artifact-transfer
    inputs:
      transferArtifacts: ${{jobs.check.outputs.transferArtifacts}}
    config:
      beforeExecute:
        isAutoSkip: ${{jobs.check.outputs.selectedCount}} = 0
        confirm: 
          buttonName: 确认发布正式库
          approvers:
            - wuxiaolin.wuxiaoli
            - qiuzihao.qzh
            - fengbin.ffb
            - lwq462262
  
  ray_data_ut:
    stage: ray-data-tests
    component: python-ut
    inputs:
      customTestConfig:
        dockerImage: ${{jobs.build.outputs.image}}
        testScript: |
          chown -R admin:admin .
          path=$(pwd)
          su - admin << EOF
            cd ${path}
            mkdir -p ./python/ray/data/tests/pytest_report
            pip install -c python/requirements_compiled.txt pytest pytest-cov pytest-asyncio pyarrow pandas
            export COVERAGE_FILE=./python/ray/data/tests/pytest_report/.coverage
            export PYTHONPATH="/home/admin/python:${PYTHONPATH:-}"
            pytest -v \
              ./python/ray/data/tests\
              --junit-xml=./python/ray/data/tests/pytest_report/TEST-junit.xml \
              --cov=./python/ray \
              --cov-report=xml:./python/ray/data/tests/pytest_report/TEST-cov.xml
          EOF
        caseReportPath: "./python/ray/data/tests/pytest_report/TEST-junit.xml"
        coverageReportPath: "./python/ray/data/tests/pytest_report/TEST-cov.xml"
    config:
      execute:
        isAllowSkip: true
      afterExecute:
        checkRule:
          - ${{outputs.caseFailCount}} = 0

  cpp_ut:
    stage: cpp-tests
    component: cpp-ut
    config:
      execute:
        isAllowSkip: true
    inputs:
      appName: ant-ray
      executeAgent:
        resourceClass: "XL"
      coverageCollectConfig:
        enable: true      
        coverDatDir: "./bazel-testlogs/"
        covXmlPath: "./coverage.xml"
      customTestConfig:
        dockerImage:  ${{jobs.build.outputs.image}}
        testScript:  |
          chown -R admin:admin .  
          set -x
          echo "==== start prepare environment, user is: `whoami` ===="
          echo "rewrite (storage.googleapis.com)/(.*) antsys-ray-prod.cn-shanghai-ant-office.oss-alipay.aliyuncs.com/moshi/\$2" >> /home/admin/.bazel_downloader.cfg
          wget -qO- https://raylet.cn-hangzhou-alipay-b.oss-cdn.aliyun-inc.com/ci/yumrepo/install_ant_yum_repo.sh | bash
          sudo yum install -y vim vsar redis jemalloc
          yum install -y http://jarvis-storage-file-test.cn-hangzhou.alipay-pub.aliyun-inc.com/leran/util/lcov-2.0-1.noarch.rpm
          echo "/usr/local/openssl/lib" | sudo tee /etc/ld.so.conf.d/openssl.conf
          sudo ldconfig
          sudo -u admin bash -c 'set +e && source ~/.bashrc && pip install --upgrade pip && echo "Bashrc loaded successfully" && env | grep -E "PATH|HOME|USER" && cd /home/jenkins/agent/aci/codeWorkspace && mkdir -p /home/jenkins/agent/aci/codeWorkspace/testresult/gtest && ./ci/ci.sh test_cpp'
          /home/jenkins/agent/aci/codeWorkspace/ci/codeCoverage.sh
          sudo -u admin bash -c 'set +e && source ~/.bashrc && cd /home/jenkins/agent/aci/codeWorkspace && lcov_cobertura /home/jenkins/agent/aci/codeWorkspace/bazel-out/_coverage/_coverage_report.dat --output coverage.xml'
        caseReportPath: "./testresult/gtest/TEST-*.xml"
        coverageReportPath: "./coverage.xml"

  java_ut1:
    stage: java-tests
    component: common-ut
    inputs:
      image: ${{jobs.build.outputs.image}}
      resourceClass: L
      script: |
        whoami
        sudo mkdir -p /home/jenkins/agent/aci/codeWorkspace/ray_java_test_output
        sudo chown -R admin:admin /home/jenkins/agent/aci/codeWorkspace/ray_java_test_output
        sudo -u admin bash -l <<'EOF'
        cd /home/admin/
        wget http://alipay-kepler-resource.cn-hangzhou.alipay.aliyun-inc.com/changhuai/ut/java_coverage_report.sh
        # Download jacoco jar and modify authority
        curl http://raylet.cn-hangzhou-alipay-b.oss-cdn.aliyun-inc.com/ci/jacoco/jacoco-0.8.11.zip -o /home/admin/jacoco.zip
        unzip /home/admin/jacoco.zip -d /home/admin/jacoco
        chmod 777 /home/admin/jacoco/lib/*.jar
        
        # Setting the environment variables of the jacoagent JVM parameters
        mkdir -p ci/java
        wget http://alipay-kepler-resource.cn-hangzhou.alipay.aliyun-inc.com/changhuai/ut/testng_ut1.xml -O ci/java/testng_ut1.xml
        export JACOCO_AGENT="-javaagent:/home/admin/jacoco/lib/jacocoagent.jar=dumponexit=true,destfile=/home/admin/jacoco_cluster.exec,includes=io.ray.*"
        java -version
        java "${JACOCO_AGENT}" -cp bazel-bin/java/all_tests_shaded.jar org.testng.TestNG -d /home/jenkins/agent/aci/codeWorkspace/ray_java_test_output ci/java/testng_ut1.xml > ut.log

        wget "http://alipay-kepler-resource.cn-hangzhou.alipay.aliyun-inc.com/changhuai/ut/rewrite_junit_xml_0319.py" -O rewrite_junit_xml.py
        cp -r /home/jenkins/agent/aci/codeWorkspace/ray_java_test_output/junitreports /home/jenkins/agent/aci/codeWorkspace/ray_java_test_output/processedReports
        find /home/jenkins/agent/aci/codeWorkspace/ray_java_test_output/processedReports/TEST-*.xml | xargs -I {} python rewrite_junit_xml.py {}
        cp /home/admin/jacoco_cluster.exec /tmp/
        cd /home/admin/
        sh java_coverage_report.sh
        ls -al /home/admin/javaCoverage/jacoco.xml
        cp /home/admin/javaCoverage/jacoco.xml /home/jenkins/agent/aci/codeWorkspace/ray_java_test_output/jacoco_coverage.xml
        EOF
      caseReportPath: "./ray_java_test_output/processedReports/TEST-*.xml"
      coverageReportPath: "./ray_java_test_output/jacoco_coverage.xml"
      enableArtifacts: true
    config:
      execute:
        isAllowSkip: true
      afterExecute:
        checkRule:
        - ${{outputs.caseFailCount}} <= 0
  
